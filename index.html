<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanchana Ariyasinghe — Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Kanchana Ariyasinghe — Computer Engineering graduate (University of Jaffna), Software Engineer, Full-Stack Developer and QA Engineer."
    />
    <meta name="author" content="Kanchana Ariyasinghe" />
    <meta name="theme-color" content="#6d28d9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kanchana Ariyasinghe — Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack, AI and QA projects, research and experience."
    />
    <meta property="og:url" content="https://kanchanaariyasinghe.github.io/my_profile/" />
    <meta property="og:image" content="https://kanchanaariyasinghe.github.io/my_profile/assets/photo2.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: preconnect + link is faster than a CSS @import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    />

    <!-- Apply the saved / system colour theme before first paint (prevents a flash). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled to display.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
